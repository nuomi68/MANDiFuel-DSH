- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-v4-flash
- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()
- id: session-persistence-jsonl
  config:
    root: !!js process.env.BENCH_TRACE_ROOT
    compression: none
    packChunks: false
# Identical network restriction in both arms; no workflow instruction is added here.
- id: tool-web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-fetch-http
  disabled: true
