- id: skill-filesystem
  # The Web bundle disables its host filesystem row in favor of preset roots.
  disabled: false
  config:
    # Keep this provider alongside the Web preset's own filesystem provider.
    providerName: mandifuel
    includeDefaultRoots: false
    customSkillDirs:
      - !!js process.env.MANDIFUEL_PLUGIN_ROOT + '/skills'
    watch: true
    watchUsePolling: true
# Ordinary tasks use prepared local materials; expose no web capability.
- id: tool-web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-fetch-http
  disabled: true
